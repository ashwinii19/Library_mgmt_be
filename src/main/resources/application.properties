spring.application.name=library_mgmt_be

 
# Database - just reference the env variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# Batch Configuration - USE DEFAULT TABLES
 
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql
spring.batch.initialize-schema=always
spring.batch.jdbc.initializer.enabled=true
 
 
# Logging
logging.level.org.springframework.batch=INFO
 
# JWT Configuration
app.jwt-secret=${APP_JWT_SECRET}
#app.jwt-expiration-ms=3600000
 
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
 
# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
 
# Application Configuration
app.base-url=${APP_BASE_URL}
 
# CORS Configuration
payflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
 
app.scheduler.timezone=${APP_TIMEZONE}
 
 
# Batch Configuration - MANUAL CREATION
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false


## JWT EXPIRES IN 2 MINUTES
#app.jwt-expiration-ms=120000
#
## SERVER SESSION TIMEOUT 2 MINUTES
#server.servlet.session.timeout=2m

# JWT expiration time in milliseconds (6 hours)
app.jwt-expiration-ms=86400000


# Server session timeout duration (6 hours)
server.servlet.session.timeout=6h


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
